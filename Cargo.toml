[package]
name = "cretopass"
version = "1.0.0"
rust-version = "1.92.0"
edition = "2024"
description = "Terminal-based secret keeper with vim-style navigation, age-encrypted file storage, and in-memory editing"
license = "MIT"
homepage = "https://github.com/Dmitrytuk/cretopass"
repository = "https://github.com/Dmitrytuk/cretopass"
authors = ["Your Name <email@example.com>"]
readme = "README.md"
keywords = ["password-manager", "tui", "terminal", "encryption", "age"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
futures-util = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3.7", default-features = false }
rkyv = "0.8"
age = "0.11"
rand = "0.8"
zeroize = { version = "1.9", features = ["derive"] }
chrono = "0.4"
lexopt = "0.3"
sysinfo = { version = "0.38", default-features = false, features = ["disk"] }
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
