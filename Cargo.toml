[package]
name = "cretopass"
version = "1.0.0"
edition = "2024"
description = "Terminal-based secret keeper with vim-style navigation, age-encrypted file storage, and in-memory editing"
license = "MIT"
homepage = "https://github.com/cretopass/cretopass"
repository = "https://github.com/cretopass/cretopass"
authors = ["Your Name <email@example.com>"]
readme = "README.md"
keywords = ["password-manager", "tui", "terminal", "encryption", "age"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rkyv = "0.8"
age = "0.11"
zeroize = "1.9"
chrono = "0.4"

[dev-dependencies]
