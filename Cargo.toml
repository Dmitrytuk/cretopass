[package]
name = "cretopass"
version = "1.1.1"
rust-version = "1.92.0"
edition = "2024"
description = "Terminal-based secret keeper with vim-style navigation, age-encrypted file storage, and in-memory editing"
license = "MIT"
homepage = "https://github.com/Dmitrytuk/cretopass"
repository = "https://github.com/Dmitrytuk/cretopass"
readme = "README.md"
keywords = ["password-manager", "tui", "terminal", "encryption", "age"]
categories = ["command-line-utilities", "cryptography"]
exclude = [
  # Local tooling and scratch data (also gitignored).
  "/.git",
  "/.github",
  "/.ai-reviews",
  "/.ai_plan",
  "/.issues",
  "/.opencode",
  "/.tmp",
  "/config_dev",
  "/test_secrets",
  # Repo-only material: docs, release packaging, and platform icons.
  # `build.rs` needs only `assets/icons/cretopass.ico`.
  "/AGENTS.md",
  "/GLOSSARY.md",
  "/GLOSSARY-MAP.md",
  "/docs",
  "/scripts",
  "/rust-toolchain",
  "/install.sh",
  "/install.ps1",
  "/assets/completions",
  "/assets/linux",
  "/assets/icons/flatpak",
  "/assets/icons/linux",
  "/assets/icons/macos",
  "/assets/icons/cretopass.icns",
  "/assets/icons/cretopass.png",
]

[dependencies]
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
futures-util = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3.7", default-features = false }
rkyv = "0.8"
age = "0.11"
rand = "0.8"
zeroize = { version = "1.9", features = ["derive"] }
chrono = "0.4"
lexopt = "0.3"
sysinfo = { version = "0.38", default-features = false, features = ["disk"] }
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
