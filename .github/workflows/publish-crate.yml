name: publish-crate

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.1.2)'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *)
              echo "::error::Release tag '$TAG' must start with 'v' (e.g. v1.1.2)"
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG (version $VERSION)"
        shell: bash

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - name: Check Cargo.toml version matches release tag
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml \
            | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match release tag ($VERSION)"
            exit 1
          fi
          echo "Version $VERSION matches Cargo.toml."
        shell: bash

      - name: Read pinned Rust toolchain
        id: rust
        run: |
          CHANNEL=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain)
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Pinned toolchain: $CHANNEL"
        shell: bash

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - uses: Swatinem/rust-cache@v2

      - name: Verify package contents
        run: |
          set -euo pipefail
          cargo package --list --locked > "$RUNNER_TEMP/package-files.txt"
          if ! grep -qx 'assets/icons/cretopass.ico' "$RUNNER_TEMP/package-files.txt"; then
            echo "::error::assets/icons/cretopass.ico is missing from the published package"
            exit 1
          fi
          if grep -E '^(test_secrets|config_dev|\.opencode|\.ai_|\.issues)/|\.age$|^docs/' "$RUNNER_TEMP/package-files.txt"; then
            echo "::error::repo-only or secret material would be published (see the paths above)"
            exit 1
          fi
        shell: bash

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set"
            exit 1
          fi
          cargo publish --locked
        shell: bash
