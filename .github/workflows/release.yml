name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
            cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            cross: false
          # windows-11-arm — публичный preview-раннер GitHub.
          # Если недоступен в вашем аккаунте — заменить на self-hosted ARM64.
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive: zip
            cross: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl-tools (x86_64 Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
        shell: bash

      - name: Install cross (ARM64 Linux musl)
        if: matrix.cross
        run: cargo install cross --locked
        shell: bash

      - name: Configure static CRT (Windows)
        if: runner.os == 'Windows'
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
        shell: bash

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}
        shell: bash

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}
        shell: bash

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - \
            target/${{ matrix.target }}/release/cretopass
        shell: bash

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf cretopass-${{ matrix.target }}.tar.gz cretopass
          mv cretopass-${{ matrix.target }}.tar.gz "$GITHUB_WORKSPACE/"
        shell: bash

      - name: Package (zip)
        if: matrix.archive == 'zip'
        run: |
          Push-Location "target/${{ matrix.target }}/release"
          7z a "cretopass-${{ matrix.target }}.zip" cretopass.exe
          Move-Item "cretopass-${{ matrix.target }}.zip" "$env:GITHUB_WORKSPACE/"
          Pop-Location
        shell: pwsh

      - name: Checksum (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd "$GITHUB_WORKSPACE"
          F="cretopass-${{ matrix.target }}.tar.gz"
          sha256sum "$F" > "$F.sha256"
        shell: bash

      - name: Checksum (zip)
        if: matrix.archive == 'zip'
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $F = "cretopass-${{ matrix.target }}.zip"
          (Get-FileHash $F -Algorithm SHA256).Hash.ToLower() + "  $F" |
            Out-File -Encoding ascii "$F.sha256"
        shell: pwsh

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: cretopass-${{ matrix.target }}
          path: cretopass-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksum install scripts
        run: |
          sha256sum install.sh  > install.sh.sha256
          sha256sum install.ps1 > install.ps1.sha256
        shell: bash

      - name: Verify install scripts
        run: |
          sha256sum -c install.sh.sha256
          sha256sum -c install.ps1.sha256
        shell: bash

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release_notes.md
          if [ ! -s /tmp/release_notes.md ]; then
            echo "::error::CHANGELOG.md has no section for version $VERSION"
            exit 1
          fi
        shell: bash

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            install.sh
            install.sh.sha256
            install.ps1
            install.ps1.sha256
            assets/linux/cretopass.desktop
            assets/icons/cretopass.png
            assets/icons/cretopass.icns
            assets/icons/cretopass.ico
            assets/completions/cretopass.bash
            assets/completions/_cretopass
            assets/completions/cretopass.fish
            assets/completions/cretopass.ps1
            artifacts/*
          body_path: /tmp/release_notes.md
          draft: true
