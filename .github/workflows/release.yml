name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Pre-flight: fail fast (before any build runner starts) if the tag does not
  # match the crate version or has no CHANGELOG section.
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m1 '^version' Cargo.toml \
              | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (ref type: ${GITHUB_REF_TYPE})"
        shell: bash

      - name: Check Cargo.toml version matches tag
        if: github.ref_type == 'tag'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml \
            | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match tag ($VERSION)"
            exit 1
          fi
          echo "Version $VERSION matches Cargo.toml."
        shell: bash

      - name: Check CHANGELOG has a non-empty section for the version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release_notes.md
          if ! grep -q '[^[:space:]]' /tmp/release_notes.md; then
            echo "::error::CHANGELOG.md has no (non-empty) section for version $VERSION"
            exit 1
          fi
        shell: bash

  build:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
            cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            cross: false
          # windows-11-arm — публичный preview-раннер GitHub.
          # Если недоступен в вашем аккаунте — заменить на self-hosted ARM64.
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive: zip
            cross: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl-tools (x86_64 Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y musl-tools && break
            echo "apt-get attempt $i failed; retrying in 10s..."
            sleep 10
          done
          command -v musl-gcc >/dev/null || { echo "musl-tools not installed"; exit 1; }
        shell: bash

      - name: Install cross (ARM64 Linux musl)
        if: matrix.cross
        run: |
          for i in 1 2 3; do
            cargo install cross --locked && break
            echo "cargo install cross attempt $i failed; retrying in 10s..."
            sleep 10
          done
          command -v cross >/dev/null || { echo "cross not installed"; exit 1; }
        shell: bash

      - name: Configure static CRT (Windows)
        if: runner.os == 'Windows'
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
        shell: bash

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}
        shell: bash

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}
        shell: bash

      - name: Verify binary reports the tagged version
        run: |
          VERSION="${{ needs.validate-tag.outputs.version }}"
          BIN="target/${{ matrix.target }}/release/cretopass"
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="$BIN.exe"; fi

          # aarch64 Linux musl is cross-built on an x86_64 host and cannot be
          # executed here; fall back to a byte search in the binary.
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            grep -aq "$VERSION" "$BIN" \
              || { echo "::error::binary does not contain version $VERSION"; exit 1; }
            echo "Version $VERSION present in cross-built binary."
          else
            OUT=$("$BIN" --version)
            echo "$OUT"
            case "$OUT" in
              *"$VERSION"*) ;;
              *) echo "::error::binary reports wrong version (expected $VERSION): $OUT"; exit 1 ;;
            esac
          fi
        shell: bash

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - \
            target/${{ matrix.target }}/release/cretopass
        shell: bash

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf cretopass-${{ matrix.target }}.tar.gz cretopass
          mv cretopass-${{ matrix.target }}.tar.gz "$GITHUB_WORKSPACE/"
        shell: bash

      - name: Package (zip)
        if: matrix.archive == 'zip'
        run: |
          Push-Location "target/${{ matrix.target }}/release"
          7z a "cretopass-${{ matrix.target }}.zip" cretopass.exe
          Move-Item "cretopass-${{ matrix.target }}.zip" "$env:GITHUB_WORKSPACE/"
          Pop-Location
        shell: pwsh

      - name: Checksum (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd "$GITHUB_WORKSPACE"
          F="cretopass-${{ matrix.target }}.tar.gz"
          sha256sum "$F" > "$F.sha256"
        shell: bash

      - name: Checksum (zip)
        if: matrix.archive == 'zip'
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $F = "cretopass-${{ matrix.target }}.zip"
          (Get-FileHash $F -Algorithm SHA256).Hash.ToLower() + "  $F" |
            Out-File -Encoding ascii "$F.sha256"
        shell: pwsh

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: cretopass-${{ matrix.target }}
          path: cretopass-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify all six target artifacts are present
        run: |
          shopt -s nullglob
          files=(artifacts/cretopass-*.tar.gz artifacts/cretopass-*.zip)
          COUNT=${#files[@]}
          echo "Found $COUNT target archives:"
          if [ "$COUNT" -gt 0 ]; then
            printf '  %s\n' "${files[@]}"
          fi
          if [ "$COUNT" -ne 6 ]; then
            echo "::error::expected 6 target archives, found $COUNT — refusing to publish a partial release"
            exit 1
          fi
        shell: bash

      - name: Checksum install scripts
        run: |
          sha256sum install.sh  > install.sh.sha256
          sha256sum install.ps1 > install.ps1.sha256
        shell: bash

      - name: Verify install scripts
        run: |
          sha256sum -c install.sh.sha256
          sha256sum -c install.ps1.sha256
        shell: bash

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${{ needs.validate-tag.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release_notes.md
          if [ ! -s /tmp/release_notes.md ]; then
            echo "::error::CHANGELOG.md has no section for version $VERSION"
            exit 1
          fi
        shell: bash

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            install.sh
            install.sh.sha256
            install.ps1
            install.ps1.sha256
            assets/linux/cretopass.desktop
            assets/icons/cretopass.png
            assets/icons/cretopass.icns
            assets/icons/cretopass.ico
            assets/completions/cretopass.bash
            assets/completions/_cretopass
            assets/completions/cretopass.fish
            assets/completions/cretopass.ps1
            artifacts/*
          body_path: /tmp/release_notes.md
          draft: true
